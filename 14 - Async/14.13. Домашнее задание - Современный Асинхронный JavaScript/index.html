<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Функция race()</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1>Проверка функции race()</h1>

    <p>
      Функция возвращает результат первого завершившегося промиса:
      успешно выполненного или отклонённого.
    </p>

    <button id="runButton" type="button">Запустить проверку</button>

    <div class="result">
      <h2>Результат</h2>
      <p id="resultText">Нажмите кнопку, чтобы запустить промисы.</p>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
