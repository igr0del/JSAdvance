<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User и Task — Rollup</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="page">
    <section class="card">
      <span class="badge">Rollup + NPM</span>
      <h1>User и Task</h1>
      <p class="description">
        Модули <strong>User</strong> и <strong>Task</strong> собраны Rollup в единый файл
        <code>bundle.js</code>.
      </p>

      <div class="status">
        <span class="status__dot" aria-hidden="true"></span>
        <span>Приложение запущено</span>
      </div>

      <div class="console-hint">
        <span>Результат работы:</span>
        <strong>откройте консоль браузера (F12)</strong>
      </div>
    </section>
  </main>

  <script src="bundle.js"></script>
</body>
</html>
