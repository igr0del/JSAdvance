<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User и Task — Rollup</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="page">
    <section class="card">
      <div class="badge">Rollup + NPM</div>

      <h1>User и Task</h1>
      <p class="subtitle">
        Проект собран из ES-модулей в единый файл <code>bundle.js</code>.
      </p>

      <div class="status">
        <span class="status__dot" aria-hidden="true"></span>
        <span>Сборка подключена и готова к запуску</span>
      </div>

      <div class="info">
        <p><strong>Что проверить:</strong></p>
        <p>Откройте инструменты разработчика → Console.</p>
        <p>Там появится сообщение: <code>Задача выполнена через Rollup!</code></p>
      </div>

      <div class="commands">
        <div class="command">
          <span>Собрать проект</span>
          <code>npm run build</code>
        </div>

        <div class="command">
          <span>Запустить сервер</span>
          <code>npm start</code>
        </div>
      </div>
    </section>
  </main>

  <script src="bundle.js"></script>
</body>
</html>
