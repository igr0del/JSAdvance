<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User и Task</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="card">
    <p class="label">ES6-модули</p>
    <h1>Взаимодействие User и Task</h1>

    <p class="description">
      При загрузке страницы создаётся задача, передаётся пользователю,
      после чего вызывается метод <code>user.do()</code>.
    </p>

    <div class="result">
      <span>Результат выполнения:</span>
      <strong>Писать код</strong>
    </div>

    <p class="hint">
      Сообщение также выводится в консоль браузера.
    </p>
  </main>

  <script type="module" src="./index.js"></script>
</body>
</html>
