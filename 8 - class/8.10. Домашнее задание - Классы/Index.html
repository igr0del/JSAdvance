<!DOCTYPE html>
<html lang="ru">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Car Manager</title>
	<link rel="stylesheet" href="styles.css">
</head>

<body>
	<div class="container">
		<h1>Управление автомобилем</h1>

		<div class="card">
			<h2>Создать автомобиль</h2>
			<div class="form-group">
				<label for="brand">Марка:</label>
				<input type="text" id="brand" placeholder="Например, Toyota">
			</div>
			<div class="form-group">
				<label for="model">Модель:</label>
				<input type="text" id="model" placeholder="Например, Camry">
			</div>
			<div class="form-group">
				<label for="initialMileage">Пробег (км):</label>
				<input type="number" id="initialMileage" placeholder="0">
			</div>
			<button id="createBtn">Создать машину</button>
		</div>

		<div class="card">
			<h2>Текущий автомобиль</h2>
			<div id="carInfo" class="car-info">Машина не создана</div>
		</div>

		<div class="card">
			<h2>Изменить пробег</h2>
			<div class="form-group">
				<label for="newMileage">Новый пробег (км):</label>
				<input type="number" id="newMileage" placeholder="Введите пробег">
			</div>
			<button id="updateMileageBtn" disabled>Обновить пробег</button>
		</div>

		<div class="card">
			<button id="infoBtn" disabled>Показать информацию в консоли</button>
		</div>
	</div>

	<script src="scripts.js"></script>
</body>

</html>
